# The verification suite IS the deploy gate.
#
# Playwright replays every topic against index.html; scripts/build-docs.mjs
# then regenerates docs/guide, docs/media and README.md from that run's
# artifacts. Only a green suite produces docs, and only matching docs deploy.
#
# Three things this fixes, each of which made a green check mean less than it
# looked (see REVIEW.md §3.9 and the adoption record's conflict table):
#   - it ran only on push to main, so no pull request was ever verified: the
#     gate fired strictly after the merge it existed to gate;
#   - `npm install playwright` with no lockfile pinned nothing in the step
#     that gates a deploy;
#   - nothing compared the regenerated artifacts with the committed ones, so
#     README.md and docs/media on GitHub could be arbitrarily stale while
#     every check was green. "Staleness = redness" held for the website and
#     not for the repository.
name: rad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: the lockfile is the claim (version-tags-are-claims).
      - name: Install pinned dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Vectors are in sync with the governed file
        run: node scripts/sync-vectors.mjs --check

      # The release gate. Deterministic only: no clock-reading test, no
      # retries, and scripts/check-gate.mjs fails the run on any skip, rerun or
      # flake by reading what the run reported rather than what the config
      # says. This is the step a tag annotation may cite as automated
      # validation (version-tags-are-claims §2, §3, §7).
      - name: Gate (deterministic; the only step a release claim may rest on)
        run: npm run gate

      # Measurements. Real and published, and NOT validation: they read a wall
      # clock, so §3 excludes them from a release claim. Run alone, because the
      # same assertion measured 0.0 ms and 1.8 ms depending only on how many
      # browsers shared the CPU.
      - name: Measure (latency budgets; reported, not claimed)
        run: npm run measure

      # --check consumes the same artifacts the suite just wrote, so it replaces
      # a regenerate step rather than following one: generating first would
      # delete the staging directory the check needs.
      #
      # The check the previous workflow lacked. Structural, not byte-equal:
      # measured values legitimately change every run (that is the "numbers are
      # measurements" rule working), and screenshots rendered on Ubuntu will
      # never match ones rendered on a contributor's machine. A byte gate over
      # either would fail permanently and teach people to ignore it. This
      # compares the topic list, the prose, the vocabulary, the geometry and
      # every guide page, with the Measured table's own values masked.
      - name: Committed artifacts match a fresh run
        run: node scripts/build-docs.mjs --check

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
