# Splash CI/CD: the unified artifact harness IS the deploy gate.
# tests/run.mjs replays every tour topic against index.html, regenerates
# docs/guide + docs/media + README, and exits nonzero on any failure —
# so a stale or broken splash never reaches Pages.
name: splash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install harness deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run unified artifact harness (tests = docs = media = README)
        run: node tests/run.mjs
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
