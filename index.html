<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>rad — QM's default radial menu</title>
<style>
  /* ============================================================
   * THEME TOKENS — the only place a colour literal may appear.
   * Two tiers, per the rad theme tokens record:
   *   palette tokens  (--rad-*)        named for what they ARE
   *   role tokens     (--rad-<part>-*) named for what they DO
   * Components reference ROLE tokens only. A theme redefines the
   * palette and inherits every role; overriding a role is allowed
   * but shows up in the diff, which is the point.
   * Every text pair here is asserted in tests/theme.spec.mjs at the
   * WCAG threshold for its rendered size, in every theme.
   * ============================================================ */
  :root, [data-theme="radical"] {
    /* radical — the default. A soft deep indigo ground rather than black, so
       the neon has something to sit on instead of vibrating against it; warm
       amber (--rad-gold) is deliberately the one non-neon hue, because a
       palette where everything glows reads as noise. */
    color-scheme: dark;
    --rad-bg: #14111f;
    --rad-surface: #1d1930;
    --rad-surface-2: #262041;
    --rad-ink: #f4eeff;
    --rad-ink-dim: #bdb2d9;
    --rad-line: #3b3358;
    --rad-line-strong: #9186c9;
    --rad-line-soft: #241f3c;
    --rad-accent: #5cf0ff;
    --rad-accent-ink: #0a0716;
    --rad-signal: #ff7aa8;
    --rad-leaf: #6ef2a0;
    --rad-calm: #4ae3d0;
    --rad-royal: #bd93ff;
    --rad-gold: #ffc861;
    --rad-sky: #5cf0ff;
    --rad-shadow: 20, 17, 31;
    --rad-accent-rgb: 92, 240, 255;
  }
  [data-theme="dark"] {
    /* dark — the quiet one. Same neon family, pulled back: lower chroma
       accents on a blue-black ground for long sessions. */
    color-scheme: dark;
    --rad-bg: #0d0f16;
    --rad-surface: #161a24;
    --rad-surface-2: #1f2430;
    --rad-ink: #eaeef7;
    --rad-ink-dim: #a3adc2;
    --rad-line: #2c3342;
    --rad-line-strong: #7f8ba5;
    --rad-line-soft: #1a1f29;
    --rad-accent: #56d8ff;
    --rad-accent-ink: #06080d;
    --rad-signal: #ff7d94;
    --rad-leaf: #6ee89a;
    --rad-calm: #4fd8c4;
    --rad-royal: #b39bff;
    --rad-gold: #f0c35c;
    --rad-sky: #56d8ff;
    --rad-shadow: 13, 15, 22;
    --rad-accent-rgb: 86, 216, 255;
  }
  [data-theme="light"] {
    /* light — neon does not survive a white background at 4.5:1, so these
       are the same hues taken down in luminance rather than a different
       palette. Soft off-white ground, never pure white. */
    color-scheme: light;
    --rad-bg: #f6f4fb;
    --rad-surface: #ffffff;
    --rad-surface-2: #eae7f4;
    --rad-ink: #16131f;
    --rad-ink-dim: #514a63;
    --rad-line: #cbc5da;
    --rad-line-strong: #6b6383;
    --rad-line-soft: #e0dcec;
    --rad-accent: #0060a8;
    --rad-accent-ink: #ffffff;
    --rad-signal: #b01248;
    --rad-leaf: #12703f;
    --rad-calm: #0d6b64;
    --rad-royal: #5b34b0;
    --rad-gold: #74540a;
    --rad-sky: #0060a8;
    --rad-shadow: 246, 244, 251;
    --rad-accent-rgb: 0, 96, 168;
  }
  [data-theme="contrast"] {
    /* contrast — AAA. Neon at high luminance on true black; every text pair
       clears 7:1 and no decorative transparency survives. */
    color-scheme: dark;
    --rad-bg: #000000;
    --rad-surface: #000000;
    --rad-surface-2: #000000;
    --rad-ink: #ffffff;
    --rad-ink-dim: #f0f0f0;
    --rad-line: #ffffff;
    --rad-line-strong: #ffffff;
    --rad-line-soft: #ffffff;
    --rad-accent: #7df9ff;
    --rad-accent-ink: #000000;
    --rad-signal: #ffa3bd;
    --rad-leaf: #8dffb0;
    --rad-calm: #6ff5e4;
    --rad-royal: #d6b8ff;
    --rad-gold: #ffd977;
    --rad-sky: #7df9ff;
    --rad-shadow: 0, 0, 0;
    --rad-accent-rgb: 125, 249, 255;
  }
  /* System preference decides only when no explicit choice is stored. The
     default is radical; a reader whose system asks for light gets light. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
    /* light — neon does not survive a white background at 4.5:1, so these
       are the same hues taken down in luminance rather than a different
       palette. Soft off-white ground, never pure white. */
    color-scheme: light;
    --rad-bg: #f6f4fb;
    --rad-surface: #ffffff;
    --rad-surface-2: #eae7f4;
    --rad-ink: #16131f;
    --rad-ink-dim: #514a63;
    --rad-line: #cbc5da;
    --rad-line-strong: #6b6383;
    --rad-line-soft: #e0dcec;
    --rad-accent: #0060a8;
    --rad-accent-ink: #ffffff;
    --rad-signal: #b01248;
    --rad-leaf: #12703f;
    --rad-calm: #0d6b64;
    --rad-royal: #5b34b0;
    --rad-gold: #74540a;
    --rad-sky: #0060a8;
    --rad-shadow: 246, 244, 251;
    --rad-accent-rgb: 0, 96, 168;
    }
  }
  :root {
    /* -- roles: every component reads these, never the palette -- */
    --rad-page-bg: var(--rad-bg);
    --rad-panel-bg: var(--rad-surface);
    --rad-panel-line: var(--rad-line);
    --rad-text: var(--rad-ink);
    --rad-text-dim: var(--rad-ink-dim);

    --rad-wedge-fill: var(--rad-surface-2);
    --rad-wedge-fill-hl: var(--rad-accent);
    --rad-wedge-stroke: var(--rad-line-strong);
    --rad-wedge-label: var(--rad-ink);
    --rad-wedge-label-hl: var(--rad-accent-ink);
    --rad-wedge-label-danger: var(--rad-signal);
    --rad-hub-fill: var(--rad-surface);
    --rad-hub-stroke: var(--rad-line-strong);
    --rad-hub-label: var(--rad-ink-dim);

    --rad-edge: var(--rad-line);
    --rad-edge-selected: var(--rad-accent);
    --rad-node-stroke: var(--rad-line-strong);
    --rad-node-stroke-selected: var(--rad-accent);
    --rad-node-label: var(--rad-ink);
    --rad-focus-ring: var(--rad-accent);
    --rad-kfocus-ring: var(--rad-leaf);
    --rad-ok: var(--rad-leaf);
    --rad-danger: var(--rad-signal);

    /* graph-kind hues, read from CSS by the renderer so themes own them */
    --rad-kind-gov: var(--rad-accent);
    --rad-kind-py: var(--rad-royal);
    --rad-kind-web: var(--rad-calm);
    --rad-kind-android: var(--rad-leaf);
    --rad-kind-new: var(--rad-gold);

    /* swatch tokens — the values `color:<token>` intents resolve to */
    --rad-swatch-sky: var(--rad-sky);
    --rad-swatch-calm: var(--rad-calm);
    --rad-swatch-royal: var(--rad-royal);
    --rad-swatch-gold: var(--rad-gold);
    --rad-swatch-signal: var(--rad-signal);

    --rad-t-fast: 130ms;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--rad-page-bg); color: var(--rad-text);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    pointer-events: none;
  }
  header .title { font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  header .sub { color: var(--rad-text-dim); font-size: 12px; white-space: nowrap; }
  header .spacer { flex: 1; }
  #hud { font: 11px ui-monospace, monospace; color: var(--rad-text-dim); text-align: right;
    line-height: 1.5; white-space: nowrap; flex: 0 0 auto; }
  #hud b { color: var(--rad-text); font-weight: 600; }
  #conf-btn { white-space: nowrap; flex: 0 0 auto; }
  #conf-btn.pass { color: var(--rad-ok); border-color: var(--rad-ok); }
  #conf-btn.fail { color: var(--rad-danger); border-color: var(--rad-danger); }
  #clock-chip, #q-chip, #midi-chip { white-space: nowrap; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  #clock-chip.beat { border-color: var(--rad-accent); color: var(--rad-accent); }
  #q-chip.on { border-color: var(--rad-accent); color: var(--rad-accent); }
  @media (max-width: 480px) {
    header { gap: 8px; flex-wrap: wrap; }
    header .sub { display: none; }
    header .title { font-size: 13px; }
    #hud { font-size: 10px; flex-basis: 100%; order: 3; }
    button.chip { font-size: 11px; padding: 4px 8px; }
    #hint { font-size: 11px; }
  }
  button.chip {
    pointer-events: auto; cursor: pointer;
    background: var(--rad-panel-bg); color: var(--rad-text); border: 1px solid var(--rad-panel-line);
    border-radius: 4px; padding: 6px 12px; font: inherit; font-size: 13px;
  }
  button.chip:focus-visible { outline: 2px solid var(--rad-accent); outline-offset: 2px; }
  #conf-result { font-size: 13px; color: var(--rad-text-dim); pointer-events: none; }
  #conf-result.pass { color: var(--rad-ok); }
  #conf-result.fail { color: var(--rad-danger); }
  #hint {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    color: var(--rad-text-dim); font-size: 12.5px; text-align: center; z-index: 5;
    pointer-events: none; padding: 0 16px; text-wrap: balance;
    transition: opacity 300ms ease;
  }
  #hint.faded { opacity: 0; }
  #log {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto;
    /* alpha mask: only the gradient's opacity is read, so currentColor keeps
       the token rule intact without changing what is painted. */
    -webkit-mask-image: linear-gradient(90deg, currentColor 85%, transparent);
            mask-image: linear-gradient(90deg, currentColor 85%, transparent);
    pointer-events: none;
  }
  #log .intent {
    flex: 0 0 auto; background: var(--rad-panel-bg); border: 1px solid var(--rad-panel-line);
    border-radius: 4px; padding: 4px 10px; font: 12px ui-monospace, monospace;
    color: var(--rad-text-dim); animation: pop 220ms ease-out;
  }
  #log .intent b { color: var(--rad-accent); font-weight: 600; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } }

  /* graph */
  .edge { stroke: var(--rad-panel-line); stroke-width: 1.5; fill: none; }
  .edge.selected { stroke: var(--rad-accent); }
  .edge-arrow { fill: var(--rad-panel-line); }
  .edge-arrow.selected { fill: var(--rad-accent); }
  .edge-label { fill: var(--rad-text-dim); font-size: 10.5px; text-anchor: middle; }
  .edge-hit { stroke: transparent; stroke-width: 22; fill: none; cursor: pointer; }
  .node circle.body { stroke: var(--rad-wedge-stroke); stroke-width: 1.5; cursor: grab; }
  .node.selected circle.body { stroke: var(--rad-accent); stroke-width: 3; }
  .node.ghost circle.body { stroke-dasharray: 4 4; fill-opacity: .35; }
  .node text { fill: var(--rad-text); font-size: 11.5px; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: var(--rad-page-bg); stroke-width: 3px; }
  .node .pin { fill: var(--rad-accent); }

  /* radial menu */
  #menu-layer { pointer-events: none; }
  .rm-wedge path {
    fill: var(--rad-wedge-fill); stroke: var(--rad-wedge-stroke); stroke-width: 1;
    transition: fill var(--rad-t-fast) ease, transform var(--rad-t-fast) ease;
  }
  .rm-wedge.hl path { fill: var(--rad-accent); }
  .rm-wedge.hl text { fill: var(--rad-accent-ink); stroke: none; }
  .rm-wedge.disabled path { fill: var(--rad-panel-bg); }
  .rm-wedge.disabled text { fill: var(--rad-text-dim); opacity: .5; }
  .rm-wedge.danger:not(.hl) text { fill: var(--rad-danger); }
  .rm-wedge.danger.hl path { fill: var(--rad-danger); }
  .rm-wedge text { fill: var(--rad-text); font-size: 12px; text-anchor: middle;
    paint-order: stroke; stroke: rgba(var(--rad-shadow), .55); stroke-width: 3px; }
  .rm-wedge .sub-caret { fill: var(--rad-text-dim); font-size: 10px; stroke: none; }
  .rm-wedge.hl .sub-caret { fill: var(--rad-accent-ink); }
  .rm-hub { fill: var(--rad-hub-fill); stroke: var(--rad-wedge-stroke); stroke-width: 1; }
  .rm-hub-label { fill: var(--rad-text-dim); font-size: 11px; text-anchor: middle; }
  .rm-root { animation: rm-in 150ms ease-out; }
  @keyframes rm-in { from { opacity: 0; } }
  @media (pointer: coarse) {
    .rm-wedge text { font-size: 13.5px; }
    .node text { font-size: 12.5px; }
    /* touch-target floor: rad interaction contract §2. Width as well as
       height — the icon-only chips (× and ■) cleared 44px vertically and
       were 35px wide, which is not a 44px target. */
    button.chip { min-height: 44px; min-width: 44px; }
  }

  /* ---- accessibility foundation ---- */
  .skip {
    position: fixed; top: -48px; left: 12px; z-index: 40;
    background: var(--rad-accent); color: var(--rad-accent-ink); padding: 10px 16px;
    border-radius: 4px; text-decoration: none; font-weight: 600;
    transition: top 120ms ease;
  }
  .skip:focus-visible { top: 12px; outline: 2px solid var(--rad-text); }
  :focus-visible { outline: 2px solid var(--rad-accent); outline-offset: 2px; }
  .node:focus { outline: none; }
  .node.kfocus circle.body { stroke: var(--rad-ok); stroke-width: 4; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (forced-colors: active) {
    .rm-wedge path, .rm-hub, .node circle.body { forced-color-adjust: none; }
    button.chip { border-width: 2px; }
  }

  /* ---- tour panel: the ONE menu on the page ---- */
  #tour-panel {
    position: fixed; z-index: 20; background: var(--rad-panel-bg);
    border: 1px solid var(--rad-panel-line); display: flex; flex-direction: column;
    right: 10px; top: 54px; bottom: 54px; width: 310px; border-radius: 6px;
    transform: translateX(0); transition: transform 160ms ease, opacity 160ms ease;
  }
  #tour-panel.closed { transform: translateX(calc(100% + 14px)); opacity: 0; pointer-events: none; }
  @media (max-width: 760px) {
    #tour-panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 46px; max-height: 46vh; }
    #tour-panel.closed { transform: translateY(calc(100% + 60px)); }
  }
  #tour-panel .t-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--rad-panel-line);
  }
  #tour-panel .t-head b { flex: 1; font-size: 14px; }
  #tour-panel .t-head .prog { color: var(--rad-text-dim); font: 11px ui-monospace, monospace; }
  #tour-panel .t-head button { min-width: 34px; }   /* raised to 44 under (pointer: coarse) below */
  #tour-panel .t-body { overflow-y: auto; padding: 4px 0 10px; overscroll-behavior: contain; }
  #tour-panel:focus-visible { outline: 2px solid var(--rad-focus-ring); outline-offset: -2px; }

  /* ---- speed controls: three axes (tempo-driven-interaction-speed §5) ---- */
  .t-speed { padding: 8px 12px 10px; border-bottom: 1px solid var(--rad-panel-line);
    display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .t-transport { display: flex; align-items: center; gap: 6px; }
  .t-transport .rate { margin-left: auto; color: var(--rad-text-dim);
    font: 11px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .t-row { display: grid; grid-template-columns: 54px 1fr auto; align-items: center;
    gap: 8px; font-size: 12px; color: var(--rad-text-dim); }
  .t-row > span:first-child { color: var(--rad-text); }
  .t-row output { font: 11px ui-monospace, monospace; font-variant-numeric: tabular-nums;
    white-space: nowrap; }
  .t-row input[type="range"] { width: 100%; accent-color: var(--rad-accent); min-height: 24px; }
  .t-row input[type="range"]:disabled { opacity: .45; }
  .t-row select { background: var(--rad-wedge-fill); color: var(--rad-text);
    border: 1px solid var(--rad-wedge-stroke); border-radius: 4px; padding: 3px 6px; font: inherit; font-size: 12px; }
  .t-link { grid-template-columns: auto 1fr; }
  .t-link input { accent-color: var(--rad-accent); width: 16px; height: 16px; }
  .t-link label { color: var(--rad-text-dim); }
  #tour-panel.playing .t-transport #play-chip { border-color: var(--rad-accent); color: var(--rad-accent); }
  @media (pointer: coarse) {
    .t-row input[type="range"] { min-height: 44px; }
    .t-link input { width: 22px; height: 22px; }
  }

  /* The icon-only chips joined the 44px-tall box at 35px wide:
     `#tour-panel .t-head button` outranks a bare `.chip`, and equal-specificity
     rules are settled by source order, so this override belongs here — after
     the panel rules — rather than in the earlier coarse-pointer block. */
  @media (pointer: coarse) {
    #tour-panel .t-head button,
    #tour-panel .t-speed button { min-width: 44px; min-height: 44px; }
  }

  /* Visually hidden, still announced. One live region, not four. */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  #tour-panel h3 {
    margin: 12px 12px 4px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--rad-text-dim); font-weight: 600;
  }
  #tour-panel ol { list-style: none; margin: 0; padding: 0; }
  .step { display: flex; gap: 8px; padding: 7px 12px; align-items: flex-start; scroll-margin-top: 40px; }
  .step + .step { border-top: 1px solid var(--rad-line-soft); }
  .step .go {
    flex: 0 0 auto; cursor: pointer; margin-top: 1px;
    width: 30px; height: 30px; border-radius: 4px; font-size: 12px; line-height: 1;
    background: var(--rad-wedge-fill); color: var(--rad-text); border: 1px solid var(--rad-wedge-stroke);
  }
  .step.seen .go { background: var(--rad-accent); color: var(--rad-accent-ink); border-color: var(--rad-accent); }
  .step.running .go { border-color: var(--rad-accent); color: var(--rad-accent); }
  .step .tx { flex: 1; min-width: 0; }
  .step .tx b { display: block; font-size: 13px; }
  .step .tx span { display: block; color: var(--rad-text-dim); font-size: 12px; line-height: 1.4; }
  .step .tx a { color: var(--rad-accent); text-decoration: none; }
  @media (pointer: coarse) { .step .go { width: 44px; height: 44px; font-size: 15px; } }

  /* ---- demo driver visuals ---- */
  #finger {
    position: fixed; z-index: 30; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--rad-accent); background: rgba(var(--rad-accent-rgb), .25);
    transform: translate(-50%, -50%); pointer-events: none; opacity: 0; left: 0; top: 0;
  }
  .ripple {
    position: fixed; z-index: 29; border-radius: 50%; border: 2px solid var(--rad-accent);
    transform: translate(-50%, -50%); pointer-events: none;
  }
  .spot {
    position: fixed; z-index: 28; border: 2px solid var(--rad-accent); border-radius: 6px;
    pointer-events: none; box-shadow: 0 0 0 4px rgba(var(--rad-accent-rgb), .18);
  }
</style>
</head>
<body>
<a class="skip" href="#tour-panel">Skip to tour</a>
<header>
  <div>
    <div class="title">rad</div>
    <div class="sub" id="subtitle">QM's default radial menu</div>
  </div>
  <div class="spacer"></div>
  <div id="hud" aria-label="interaction meters"></div>
  <button class="chip" id="tour-chip" aria-expanded="true" aria-controls="tour-panel">Tour</button>
  <button class="chip" id="clock-chip" title="clock source and tempo">♩60 int</button>
  <button class="chip" id="q-chip" title="quantize commits to the clock">Q off</button>
  <button class="chip" id="midi-chip" title="listen for external MIDI clock and CC">MIDI</button>
  <button class="chip" id="theme-chip" title="cycle colour theme" aria-label="Colour theme: dark. Activate to cycle.">◐ dark</button>
  <button class="chip" id="conf-btn">Vectors ▷</button>
</header>

<svg id="stage" role="application" aria-label="Graph canvas. Long-press or right-click for radial menu.">
  <g id="viewport">
    <g id="edges"></g>
    <g id="nodes"></g>
  </g>
  <g id="menu-layer"></g>
</svg>

<div id="hint">Long-press / right-click for the menu · drag nodes · pinch / wheel to zoom · <b>m</b> = menu on selection · the <b>Tour</b> shows everything else</div>
<!-- The intent log is decoration for a screen-reader user: it repeats, as a
     stream, what the single live region has already announced once. It is
     hidden from the accessibility tree rather than made a fourth competing
     announcer. -->
<div id="log" aria-hidden="true"></div>
<div id="sr-live" role="status" aria-live="polite" class="sr-only"></div>

<aside id="tour-panel" role="region" aria-label="Interactive tour" tabindex="-1">
  <div class="t-head">
    <b>Tour</b>
    <span class="prog" id="tour-prog"></span>
    <button class="chip" id="tour-close" aria-label="Close tour">×</button>
  </div>

  <!-- Speed: three axes, native form controls. A cycling chip would be cheaper
       and match the header, but it cannot report its range to a screen reader
       and cannot be set directly. See the tempo-driven-interaction-speed
       record §5. -->
  <div class="t-speed" role="group" aria-label="Playback speed">
    <div class="t-transport">
      <button class="chip" id="play-chip" aria-label="Play the whole tour">▶ Play</button>
      <button class="chip" id="stop-chip" aria-label="Stop playback" disabled>■</button>
      <span class="rate" id="rate-read" aria-hidden="true"></span>
    </div>
    <label class="t-row" for="bpm-range">
      <span>Tempo</span>
      <input type="range" id="bpm-range" min="30" max="300" step="1" value="60"
             aria-describedby="bpm-out">

'use strict';
/* ============================================================
 * CORE — platform-free. geometry + state machine.
 * This block has no DOM references; the conformance runner
 * exercises exactly these functions. (Seam per the contract.)
 * ============================================================ */
const GEOM = { startDeg: -90, clockwise: true, r0: 36, r1: 108, cancelScale: 1.35, longPressMs: 350, slop: 10 };
const MAX_ITEMS = 8;                 // contract §1; the resolver enforces it
/* The committing band, identical in both commit styles (contract §2/§3).
 * Inward of r0 is the dead-zone cancel; outward of r_cancel is its mirror.
 * Before this bound existed, release-select had no outer limit at all and
 * tap-select cancelled at 1.35·r1 — the same point committed or cancelled
 * depending on how the menu had been opened. */
function rCancel(g = GEOM) { return g.r1 * g.cancelScale; }
function inBand(r, g = GEOM) { return r > g.r0 && r <= rCancel(g); }

function normDeg(d) { return ((d % 360) + 360) % 360; }
function angleToIndex(thetaDeg, n, startDeg = GEOM.startDeg) {
  const rel = normDeg(thetaDeg - startDeg);
  return Math.round(rel / (360 / n)) % n;
}
function itemCenterDeg(i, n, startDeg = GEOM.startDeg) { return startDeg + i * (360 / n); }

/* ---- time core (pure) ----
 * MIDI clock = 24 ppqn 0xF8 ticks. Tempo from the median inter-tick
 * period (robust to USB jitter). Quantization maps a wall-clock time
 * onto a grid {phase, period}; scheduler commits at max(now, gridT). */
const TIME = { ppqn: 24, chordGapMs: 30, burstSplitMs: 250 };

function medianOf(xs) {
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function estimateBpm(tickTimes, ppqn = TIME.ppqn) {
  if (tickTimes.length < 2) return null;
  const diffs = [];
  for (let i = 1; i < tickTimes.length; i++) diffs.push(tickTimes[i] - tickTimes[i - 1]);
  const p = medianOf(diffs);
  return p > 0 ? 60000 / (p * ppqn) : null;
}
function quantizeTime(t, phase, period, policy) {
  if (policy === 'nearest') return phase + Math.round((t - phase) / period) * period;
  return phase + Math.ceil((t - phase - 1e-9) / period) * period;   // 'next' (on-grid stays)
}
/* ---- chord core (pure) ----
 * A CharaChorder chord arrives as a word whose inter-key gaps are
 * machine-fast; serial typing is human-slow. Same words, same verbs —
 * `chorded` only affects IPA accounting (a chord is one input). */
function splitBursts(evts, splitGap = TIME.burstSplitMs) {
  const out = [];
  for (const e of evts) {
    const cur = out[out.length - 1];
    if (!cur || e.t - cur[cur.length - 1].t > splitGap) out.push([e]);
    else cur.push(e);
  }
  return out;
}
function classifyBurst(evts, chordGap = TIME.chordGapMs) {
  const word = evts.map(e => e.k).join('');
  let chorded = evts.length >= 2;
  for (let i = 1; i < evts.length; i++) if (evts[i].t - evts[i - 1].t > chordGap) chorded = false;
  return { word, chorded };
}

/* Reducer-style machine. step(state, ev) -> { state, effects[] }
 * ev: {type:'down'|'longpress'|'move'|'up'|'open'|'key'|'close', r, thetaDeg, key}
 * Effects: {t:'highlight',i} {t:'commit',item} {t:'cancel'} {t:'submenu',item} {t:'back'} {t:'open'}
 */
/* Contract §1: at most 8 items per ring, and the resolver enforces it rather
 * than a reviewer noticing. Checked here so submenu rings are covered too —
 * overflow is a design error, and thinner-than-44-unit wedges are what it
 * silently produces. */
function assertRing(items, where) {
  if (!Array.isArray(items) || items.length < 1)
    throw new RangeError(`rad: ${where} ring must hold at least one item`);
  if (items.length > MAX_ITEMS)
    throw new RangeError(`rad: ${where} ring has ${items.length} items, contract §1 caps a ring at ${MAX_ITEMS} — group into a submenu`);
}
function createMachine(spec) {
  assertRing(spec.items, spec.title || 'root');
  return {
    status: 'closed',          // closed | pending | open
    mode: null,                // 'tracking' (release-select) | 'idle' (tap-select)
    stack: [spec],             // submenu stack; top = current MenuSpec
    highlight: null,
    pressIndex: null,
    opened: false, committed: null, cancelled: false,
  };
}
function mItems(s) { return s.stack[s.stack.length - 1].items; }

function step(s, ev) {
  const fx = [];
  const items = mItems(s);
  const n = items.length;
  /* A highlight effect carries the resolved label and id, not just an index
   * (contract §3). A batch can replace the ring — `submenu` does — so an index
   * alone is ambiguous by the time the consumer reads it: it names the ring
   * that was current when the effect was emitted, and the consumer sees the
   * ring that is current after the whole batch. */
  const setHl = (i) => {
    if (i === s.highlight) return;
    s.highlight = i;
    const it = i == null ? null : items[i];
    fx.push({ t: 'highlight', i, id: it ? it.id : null, label: it ? (it.label ?? '') : '' });
  };
  const beyond = (r) => r > rCancel();

  switch (ev.type) {
    case 'open':                     // explicit open -> tap-select mode
      s.status = 'open'; s.mode = 'idle'; s.opened = true; fx.push({ t: 'open' });
      break;

    case 'down':
      if (s.status === 'closed') { s.status = 'pending'; break; }
      if (s.status === 'open' && s.mode === 'idle') {
        if (ev.r <= GEOM.r0) { s.pressIndex = 'hub'; break; }   // latch the back/cancel affordance
        if (beyond(ev.r)) { close(s, fx, true); break; }
        s.pressIndex = angleToIndex(ev.thetaDeg, n); setHl(s.pressIndex);
      }
      break;

    case 'longpress':                // pending press matured -> release-select mode
      if (s.status === 'pending') { s.status = 'open'; s.mode = 'tracking'; s.opened = true; fx.push({ t: 'open' }); }
      break;

    case 'move':
      if (s.status !== 'open') break;
      // A latched hub press can no longer commit a wedge, so it must not
      // highlight one: a highlight that cannot commit is the interface lying
      // about its own next state, and it fires a haptic for a non-event.
      if (s.pressIndex === 'hub') break;
      if (inBand(ev.r)) {
        const i = angleToIndex(ev.thetaDeg, n);
        setHl(i);
        // drag-through submenu entry (release-select only)
        if (s.mode === 'tracking' && ev.r > GEOM.r1 + 12 && items[i] && items[i].children) {
          enterSub(s, fx, items[i]);
        }
      } else setHl(null);            // inside the dead zone, or beyond r_cancel
      break;

    case 'up':
      if (s.status === 'pending') { close(s, fx, true); break; }   // short press: never opened
      if (s.status !== 'open') break;
      if (s.mode === 'tracking') {
        if (inBand(ev.r) && s.highlight != null) commit(s, fx, items[s.highlight]);
        else close(s, fx, true);                                   // dead zone or beyond r_cancel
      } else { // idle / tap-select
        if (s.pressIndex === 'hub') { s.pressIndex = null; back(s, fx); break; }
        if (s.pressIndex != null && inBand(ev.r) && angleToIndex(ev.thetaDeg, n) === s.pressIndex) {
          commit(s, fx, items[s.pressIndex]);
        }
        s.pressIndex = null;
      }
      break;

    case 'key':
      if (s.status !== 'open') break;
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') setHl(s.highlight == null ? 0 : (s.highlight + 1) % n);
      else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') setHl(s.highlight == null ? n - 1 : (s.highlight - 1 + n) % n);
      else if (ev.key === 'Enter') { if (s.highlight != null) commit(s, fx, items[s.highlight]); }
      else if (ev.key === 'Escape') back(s, fx);
      break;

    case 'close': close(s, fx, true); break;
  }
  return fx;

  function enterSub(st, fx2, item) {
    assertRing(item.children, item.label || item.id);
    st.stack.push({ items: item.children, title: item.label });
    st.highlight = null; st.pressIndex = null;
    fx2.push({ t: 'submenu', item });
  }
  function back(st, fx2) {
    if (st.stack.length > 1) { st.stack.pop(); st.highlight = null; fx2.push({ t: 'back' }); }
    else close(st, fx2, true);
  }
  function commit(st, fx2, item) {
    if (!item || item.enabled === false) { close(st, fx2, true); return; }
    if (item.children) { enterSub(st, fx2, item); if (st.mode === 'tracking') st.mode = 'idle'; return; }
    st.committed = item; st.status = 'closed';
    fx2.push({ t: 'commit', item });
  }
  function close(st, fx2, cancelled) {
    st.status = 'closed'; st.cancelled = !!cancelled; st.highlight = null;
    fx2.push({ t: 'cancel' });
  }
}

/* Prefix-freeness is the property the whole chord-TTC claim rests on: a known

        catch { threw = true; }

      }
    } else if (c.vocab) {

      if ((cols.length === 0) !== c.vocab.expectPrefixFree) { pass = false; why = `collisions ${JSON.stringify(cols)}`; }
      else if (c.vocab.expectCollisions && JSON.stringify(cols) !== JSON.stringify(c.vocab.expectCollisions))

    } else if (c.aps) {

        if (Math.abs(got - k.expectAps) > 1e-9) { pass = false; why = `bpm=${k.bpm} div=${k.div} → ${got}`; break; }
      }
    } else if (c.cc) {

      }

      }

      }

      if (c.tempo.periods.length) times.push(t);

    } else if (c.split) {

      if (JSON.stringify(words) !== JSON.stringify(c.split.expectWords))
        { pass = false; why = JSON.stringify(words); }
    } else if (c.pure) {
      for (const p of c.pure) {

        if (got !== p.expectIndex) { pass = false; why = `θ=${p.thetaDeg} → ${got}, want ${p.expectIndex}`; break; }
      }
    } else {
      const spec = { items: Array.from({ length: c.n }, (_, i) => ({ id: 'i' + i, label: 'i' + i })) };
      const st = createMachine(spec);

      for (const ev of c.trace) {
        for (const f of step(st, ev)) if (f.t === 'highlight') { hl.push(f.i); if (f.i != null) labels.push(f.label); }
      }
      const e = c.expect;

      if (JSON.stringify(hl) !== JSON.stringify(c.expectHighlights)) { pass = false; why = `highlights ${JSON.stringify(hl)}`; }
      else if (c.expectLabels && JSON.stringify(labels) !== JSON.stringify(c.expectLabels)) { pass = false; why = `labels ${JSON.stringify(labels)}`; }
      else if (committedIdx !== e.committed) { pass = false; why = `committed ${committedIdx}`; }
      else if (st.cancelled !== e.cancelled) { pass = false; why = `cancelled ${st.cancelled}`; }
      else if ('opened' in e && st.opened !== e.opened) { pass = false; why = `opened ${st.opened}`; }
      else if (e.stillOpen && st.status !== 'open') { pass = false; why = `status ${st.status}`; }

 * Chords arrive as HID keyboard words with machine-fast inter-key
 * gaps. One burst = one L1 gesture; a chorded burst = ONE input.
 * Verbs are the same L3 vocabulary the menu resolves to. */
const CHORD_MAP = {
  pin: 'pin', hd: 'hide', del: 'delete', nbr: 'select-neighbors',
  fit: 'fit', lay: 'relayout', add: 'add-node', un: 'show-hidden',
  sp: 'spread', cl: 'cluster', ds: 'clear-selection',
  red: 'color:signal', blu: 'color:sky', tea: 'color:calm',
  vio: 'color:royal', gld: 'color:gold',
};
const burst = { evts: [], timer: null };
function chordKey(e) {
  meters.l0++; meters.inputsSinceIntent++;
  lastInputT = e.timeStamp;
  burst.evts.push({ k: e.key.toLowerCase(), t: e.timeStamp });
  clearTimeout(burst.timer);
  // No chord word is a prefix of another, so an exact match finalizes
  // immediately — chord TTC is the last keystroke, not the split window.
  const word = burst.evts.map(x => x.k).join('');
  const extendable = Object.keys(CHORD_MAP).some(w => w !== word && w.startsWith(word));
  if (CHORD_MAP[word] && !extendable) finalizeBurst();
  else burst.timer = setTimeout(finalizeBurst, TIME.burstSplitMs);
}
function finalizeBurst() {
  const evts = burst.evts; burst.evts = [];
  if (!evts.length) return;
  meters.l1++;
  const { word, chorded } = classifyBurst(evts);
  const verb = CHORD_MAP[word];
  if (!verb) {   // stray typing: refund, don't pollute IPA
    meters.inputsSinceIntent = Math.max(0, meters.inputsSinceIntent - evts.length);
    meterHud(); return;
  }
  if (chorded) meters.inputsSinceIntent = Math.max(1, meters.inputsSinceIntent - (evts.length - 1));
  const ctx = chordContext();
  dispatchIntent({ action: verb, context: ctx, itemId: null, via: chorded ? 'chord' : 'typed' },
    evts[evts.length - 1].t);
  meterHud();
}
function chordContext() {
  // The selection can outlive its nodes — delete and hide both remove nodes,
  // and select-neighbors on an empty target used to insert a stale id. Resolve
  // against the store rather than trusting the set, or the next chord throws
  // reading .x of undefined and silently ends the burst.
  const ids = [...store.selection].filter((id) => store.nodes.has(id));
  if (ids.length !== store.selection.size) {
    store.selection.clear(); ids.forEach((id) => store.selection.add(id));
  }
  if (ids.length > 1) return { type: 'selection', targetIds: ids, position: centroid(ids) };
  if (ids.length === 1) {
    const n = store.nodes.get(ids[0]);
    return { type: 'node', targetIds: ids, position: { x: n.x, y: n.y } };
  }
  return { type: 'canvas', targetIds: [], position: toWorld(VW() / 2, VH() / 2) };
}

/* ---------- theme layer ----------
 * Colour lives in CSS custom properties and nowhere else (theme-tokens
 * record §1). Nodes and intents carry TOKEN NAMES; the renderer resolves
 * them through the active theme. That is what lets a recorded intent
 * replay correctly under a theme that did not exist when it was recorded. */
const THEMES = ['radical', 'dark', 'light', 'contrast'];
/* radical is the default: a soft deep-indigo ground with neon accents and one
 * deliberately warm, non-neon hue. A reader whose system asks for light gets
 * light instead — a neon dark theme forced on someone who set a light
 * preference is a preference being overruled, not a mood. */
function defaultTheme() { return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'radical'; }
const SWATCH_TOKENS = ['sky', 'calm', 'royal', 'gold', 'signal'];
const KIND_TOKEN = { gov: 'kind-gov', py: 'kind-py', web: 'kind-web', android: 'kind-android', new: 'kind-new' };
let tokenCache = new Map();
function token(name) {                       // '--rad-' is implied
  if (tokenCache.has(name)) return tokenCache.get(name);
  const v = getComputedStyle(document.documentElement).getPropertyValue('--rad-' + name).trim();
  tokenCache.set(name, v);
  return v;
}
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') || defaultTheme();
}
function setTheme(name) {
  document.documentElement.setAttribute('data-theme', name);
  tokenCache = new Map();                    // resolved values are now stale
  try { localStorage.setItem('rad.theme', name); } catch { /* private mode */ }
  const chip = document.getElementById('theme-chip');
  if (chip) { chip.textContent = '◐ ' + name; chip.setAttribute('aria-label', `Colour theme: ${name}. Activate to cycle.`); }
  render();
  if (menu.active) drawMenu();
}

const STACK = [
  ['qm', 'gov'], ['qmcp', 'py'], ['dossier', 'py'], ['apothecary', 'py'],
  ['alfred', 'py'], ['al-admin', 'py'], ['otto', 'py'],
  ['codecartographer', 'web'], ['benchmark', 'web'],
  ['qmetronome', 'android'], ['rad', 'new'], ['g0', 'gov'],
];
const LINKS = [
  ['qm', 'codecartographer'], ['qm', 'qmetronome'], ['qm', 'apothecary'], ['qm', 'alfred'],
  ['qm', 'qmcp'], ['qm', 'dossier'], ['qm', 'benchmark'], ['qm', 'otto'],
  ['alfred', 'otto'], ['alfred', 'al-admin'],
  ['codecartographer', 'rad'], ['qmetronome', 'rad'],
  ['qm', 'g0'], ['rad', 'g0'], ['dossier', 'qmcp'],
];

const VW = () => document.documentElement.clientWidth || innerWidth;
const VH = () => document.documentElement.clientHeight || innerHeight;

function seedGraph() {
  const W = VW(), H = VH(), cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.34;
  STACK.forEach(([id, kind], i) => {
    const a = (-90 + i * 360 / STACK.length) * Math.PI / 180;
    store.nodes.set(id, {
      id, label: id, kind, colorToken: KIND_TOKEN[kind],
      x: cx + R * Math.cos(a), y: cy + R * Math.sin(a),
      hidden: false, pinned: false, ghost: id === 'g0',
    });
  });
  LINKS.forEach(([s, t], i) => store.edges.push({ id: 'e' + i, source: s, target: t, label: '' }));
  relayout(200);
}

function relayout(iters = 120) {
  const ns = [...store.nodes.values()].filter(n => !n.hidden);
  const W = VW(), H = VH();
  for (let k = 0; k < iters; k++) {
    // repulsion
    for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
      const a = ns[i], b = ns[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy || 1; const d = Math.sqrt(d2);
      const f = Math.min(12, 9000 / d2);
      dx /= d; dy /= d;
      if (!a.pinned) { a.x -= dx * f; a.y -= dy * f; }
      if (!b.pinned) { b.x += dx * f; b.y += dy * f; }
    }
    // springs
    for (const e of store.edges) {
      const a = store.nodes.get(e.source), b = store.nodes.get(e.target);
      if (!a || !b || a.hidden || b.hidden) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - 150) * 0.015; dx /= d; dy /= d;
      if (!a.pinned) { a.x += dx * f; a.y += dy * f; }
      if (!b.pinned) { b.x -= dx * f; b.y -= dy * f; }
    }
    // soft center
    for (const n of ns) if (!n.pinned) {
      n.x += (W / 2 - n.x) * 0.002; n.y += (H / 2 - n.y) * 0.002;
    }
  }
}

let nodeSeq = 0;
function applyIntent(intent) {
  const { action, context } = intent;
  const ids = context.targetIds;
  const nodesOf = () => ids.map(id => store.nodes.get(id)).filter(Boolean);
  switch (action) {
    case 'pin':       nodesOf().forEach(n => n.pinned = !n.pinned); break;
    case 'hide':      nodesOf().forEach(n => { n.hidden = true; store.selection.delete(n.id); }); break;
    case 'delete':
      if (context.type === 'edge') store.edges = store.edges.filter(e => e.id !== ids[0]);
      else {
        ids.forEach(id => { store.nodes.delete(id); store.selection.delete(id); });
        store.edges = store.edges.filter(e => store.nodes.has(e.source) && store.nodes.has(e.target));
      }
      break;
    case 'select-neighbors': {
      const id = ids[0];
      if (!store.nodes.has(id)) break;      // no target: a no-op, not a corrupt selection
      store.selection.clear(); store.selection.add(id);
      store.edges.forEach(e => {
        if (e.source === id) store.selection.add(e.target);
        if (e.target === id) store.selection.add(e.source);
      });
      break;
    }
    case 'reverse': { const e = store.edges.find(e => e.id === ids[0]); if (e) [e.source, e.target] = [e.target, e.source]; break; }
    case 'edit-label': { const e = store.edges.find(e => e.id === ids[0]); if (e) { const L = ['', 'governs', 'depends', 'informs']; e.label = L[(L.indexOf(e.label) + 1) % L.length]; } break; }
    case 'add-node': {
      const id = 'node-' + (++nodeSeq);
      store.nodes.set(id, { id, label: id, kind: 'new', colorToken: KIND_TOKEN.new,
        x: context.position.x, y: context.position.y, hidden: false, pinned: false, ghost: false });
      break;
    }
    case 'fit':       fitView(); break;
    case 'relayout':  relayout(160); break;
    case 'show-hidden': store.nodes.forEach(n => n.hidden = false); break;
    case 'spread': {
      const sel = nodesOf();
      const cx = sel.reduce((s, n) => s + n.x, 0) / sel.length, cy = sel.reduce((s, n) => s + n.y, 0) / sel.length;
      sel.forEach(n => { const dx = n.x - cx, dy = n.y - cy, d = Math.hypot(dx, dy) || 1; n.x = cx + dx / d * (d + 90); n.y = cy + dy / d * (d + 90); });
      break;
    }
    case 'cluster': {
      const sel = nodesOf();
      const cx = sel.reduce((s, n) => s + n.x, 0) / sel.length, cy = sel.reduce((s, n) => s + n.y, 0) / sel.length;
      sel.forEach((n, i) => { const a = (-90 + i * 360 / sel.length) * Math.PI / 180; n.x = cx + 60 * Math.cos(a); n.y = cy + 60 * Math.sin(a); n.pinned = true; });
      break;
    }
    case 'clear-selection': store.selection.clear(); break;
    case 'select':   ids.forEach(id => store.selection.add(id)); break;
    case 'deselect': ids.forEach(id => store.selection.delete(id)); break;
    default:
      if (action.startsWith('color:')) {
        const tok = action.slice(6);
        if (!SWATCH_TOKENS.includes(tok)) break;      // unknown token is not a colour
        nodesOf().forEach(n => n.colorToken = 'swatch-' + tok);
      }
  }
  intent.cost = meters.inputsSinceIntent;
  meters.costs.push(intent.cost);
  meters.inputsSinceIntent = 0;
  meters.l3++;
  store.intents.push(intent);
  logIntent(intent);
  meterHud();
  render();
}

/* ---------- resolver: context -> MenuSpec ---------- */
function resolveMenu(ctx) {
  const colorSub = SWATCH_TOKENS.map(tok => (
    { id: 'color-' + tok, label: tok, swatch: 'swatch-' + tok, action: 'color:' + tok }));
  if (ctx.type === 'node') {
    const n = store.nodes.get(ctx.targetIds[0]);
    return { title: n.label, items: [
      { id: 'pin', label: n.pinned ? 'Unpin' : 'Pin', action: 'pin' },
      { id: 'neighbors', label: 'Neighbors', action: 'select-neighbors' },
      { id: 'color', label: 'Color', children: colorSub },
      { id: 'hide', label: 'Hide', action: 'hide' },
      { id: 'delete', label: 'Delete', action: 'delete', destructive: true },
    ] };
  }
  if (ctx.type === 'edge') {
    return { title: 'edge', items: [
      { id: 'reverse', label: 'Reverse', action: 'reverse' },
      { id: 'label', label: 'Label', action: 'edit-label' },
      { id: 'delete', label: 'Delete', action: 'delete', destructive: true },
    ] };
  }
  if (ctx.type === 'selection') {
    return { title: store.selection.size + ' selected', items: [
      { id: 'cluster', label: 'Cluster', action: 'cluster' },
      { id: 'spread', label: 'Spread', action: 'spread' },
      { id: 'hide', label: 'Hide', action: 'hide' },
      { id: 'clear', label: 'Deselect', action: 'clear-selection' },
      { id: 'delete', label: 'Delete', action: 'delete', destructive: true },
    ] };
  }
  const anyHidden = [...store.nodes.values()].some(n => n.hidden);
  return { title: 'canvas', items: [
    { id: 'add', label: 'Add node', action: 'add-node' },
    { id: 'fit', label: 'Fit', action: 'fit' },
    { id: 'relayout', label: 'Layout', action: 'relayout' },
    { id: 'show', label: 'Unhide', action: 'show-hidden', enabled: anyHidden },
  ] };
}

/* ============================================================
 * DOM LAYER — SVG rendering + pointer/keyboard adapters
 * ============================================================ */
const svg = document.getElementById('stage');
const gView = document.getElementById('viewport');
const gEdges = document.getElementById('edges');
const gNodes = document.getElementById('nodes');
const gMenu = document.getElementById('menu-layer');
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (t, attrs = {}) => { const e = document.createElementNS(SVGNS, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

let view = { x: 0, y: 0, k: 1 };  // pan/zoom
function applyView() { gView.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function toWorld(px, py) { return { x: (px - view.x) / view.k, y: (py - view.y) / view.k }; }

function fitView() {
  const ns = [...store.nodes.values()].filter(n => !n.hidden);
  if (!ns.length) return;
  const pad = 70;
  const minX = Math.min(...ns.map(n => n.x)) - pad, maxX = Math.max(...ns.map(n => n.x)) + pad;
  const minY = Math.min(...ns.map(n => n.y)) - pad, maxY = Math.max(...ns.map(n => n.y)) + pad;
  const k = Math.min(VW() / (maxX - minX), (VH() - 120) / (maxY - minY), 1.6);
  view = { k, x: VW() / 2 - k * (minX + maxX) / 2, y: VH() / 2 - k * (minY + maxY) / 2 };
  applyView();
}

function render() {
  // render() rebuilds every node element, which drops document.activeElement.
  // Capture the focused node id and restore it after, so a drag, a theme
  // change, or any other re-render cannot silently eject a keyboard user
  // from the graph.
  const hadFocus = document.activeElement?.getAttribute?.('data-node') ?? null;
  gEdges.textContent = ''; gNodes.textContent = '';
  for (const e of store.edges) {
    const a = store.nodes.get(e.source), b = store.nodes.get(e.target);
    if (!a || !b || a.hidden || b.hidden) continue;
    const sel = store.selection.has(a.id) && store.selection.has(b.id);
    const line = el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'edge' + (sel ? ' selected' : '') });
    gEdges.appendChild(line);
    // arrowhead
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const tx = b.x - dx / d * 26, ty = b.y - dy / d * 26;
    const ang = Math.atan2(dy, dx);
    const p = (o) => `${tx - 9 * Math.cos(ang - o)},${ty - 9 * Math.sin(ang - o)}`;
    gEdges.appendChild(el('polygon', { points: `${tx},${ty} ${p(0.42)} ${p(-0.42)}`, class: 'edge-arrow' + (sel ? ' selected' : '') }));
    if (e.label) {
      const t = el('text', { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 6, class: 'edge-label' });
      t.textContent = e.label; gEdges.appendChild(t);
    }
    const hit = el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'edge-hit', 'data-edge': e.id });
    gEdges.appendChild(hit);
  }
  for (const n of store.nodes.values()) {
    if (n.hidden) continue;
    const g = el('g', {
      class: 'node' + (store.selection.has(n.id) ? ' selected' : '') + (n.ghost ? ' ghost' : '') + (n.id === focusNodeId ? ' kfocus' : ''),
      'data-node': n.id, transform: `translate(${n.x},${n.y})`,
      tabindex: n.id === focusNodeId ? '0' : '-1', role: 'button',
      'aria-label': `node ${n.label}${store.selection.has(n.id) ? ', selected' : ''}`,
    });
    g.appendChild(el('circle', { class: 'body', r: 19, fill: token(n.colorToken), 'fill-opacity': 0.85 }));
    if (n.pinned) g.appendChild(el('circle', { class: 'pin', r: 3.5, cx: 13, cy: -13 }));
    const t = el('text', { y: 34 }); t.textContent = n.label; g.appendChild(t);
    gNodes.appendChild(g);
  }
  if (hadFocus) {
    const again = gNodes.querySelector(`[data-node="${hadFocus}"]`);
    if (again) again.focus({ preventScroll: true });
  }
}

/* ---------- intent log ---------- */
const logEl = document.getElementById('log');
function logIntent(it) {
  const d = document.createElement('div');
  d.className = 'intent';
  d.innerHTML = `<b>${it.action}</b> · ${it.context.type}${it.context.targetIds.length ? ' [' + it.context.targetIds.join(',') + ']' : ''}`
    + (it.cost != null ? ' · ' + it.cost + '⊙' : '')
    + (it.via === 'chord' ? ' · ⚡' : it.via === 'typed' ? ' · ⌨' : '')
    + (it.grid ? ` · @b${it.grid.beat}${it.grid.deltaMs >= 0 ? '+' : ''}${it.grid.deltaMs}ms` : '');
  logEl.prepend(d);
  while (logEl.children.length > 12) logEl.lastChild.remove();
}

/* ---------- radial menu view ---------- */
const menu = { active: null };  // {machine, ctx, cx, cy, group}

function clampCenter(x, y) {
  const m = GEOM.r1 + 24;
  return { x: Math.min(Math.max(x, m), VW() - m), y: Math.min(Math.max(y, Math.max(m, 64)), VH() - m - 40) };
}

function openMenu(ctx, screenX, screenY, mode) {
  document.getElementById('hint').classList.add('faded');
  closeMenu();
  const spec = resolveMenu(ctx);
  const { x, y } = clampCenter(screenX, screenY);
  const machine = createMachine(spec);
  menu.active = { machine, ctx, cx: x, cy: y, group: null };
  if (mode === 'idle') feed({ type: 'open' });
  else { machine.status = 'pending'; feed({ type: 'longpress' }); }
  svg.setAttribute('aria-label', 'Radial menu open: ' + (spec.title || ctx.type));
}

function feed(ev) {
  const a = menu.active; if (!a) return;
  const fx = step(a.machine, ev);
  // L2 is "state-machine transitions" (metrics record §2). One transition can
  // emit several effects, so effects are a different quantity and are metered
  // as one; conflating them made cross-platform comparison at L2 meaningless.
  if (fx.length) meters.l2++;
  meters.fx += fx.length;
  for (const f of fx) {
    if (f.t === 'highlight') {
      if (navigator.vibrate && f.i != null) navigator.vibrate(8);
      drawMenu();
      announce(f.label || '');       // carried by the effect; never re-resolved
    }
    if (f.t === 'open' || f.t === 'submenu' || f.t === 'back') drawMenu();
    if (f.t === 'commit') {
      const item = f.item;
      gMenu.textContent = ''; const done = menu.active; menu.active = null;
      dispatchIntent({ action: item.action, context: done.ctx, itemId: item.id }, lastInputT);
    }
    if (f.t === 'cancel') closeMenu();
  }
}

/* The page's single live region. It is in the markup rather than created on
 * demand, and it is the ONLY announcer: the intent log, the tour progress
 * counter and the vectors button used to be live regions too, so a screen
 * reader received four competing streams during a tour. */
function announce(text) {
  const lr = document.getElementById('sr-live');
  if (lr) lr.textContent = text;
}

function arcPath(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M${x0},${y0} A${r1},${r1} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${large} 0 ${x3},${y3} Z`;
}

function drawMenu() {
  const a = menu.active; if (!a) { gMenu.textContent = ''; return; }
  gMenu.textContent = '';
  const items = mItems(a.machine), n = items.length, half = 180 / n;
  const root = el('g', { class: 'rm-root', role: 'menu', 'aria-label': a.machine.stack[a.machine.stack.length - 1].title || 'menu' });
  items.forEach((item, i) => {
    const c = itemCenterDeg(i, n);
    const g = el('g', { class: 'rm-wedge' + (a.machine.highlight === i ? ' hl' : '') + (item.enabled === false ? ' disabled' : '') + (item.destructive ? ' danger' : ''), role: 'menuitem', 'aria-label': item.label || item.id });
    const grow = a.machine.highlight === i ? 8 : 0;
    g.appendChild(el('path', { d: arcPath(a.cx, a.cy, GEOM.r0 + 3, GEOM.r1 + grow, c - half + 1.2, c + half - 1.2) }));
    const rm = (GEOM.r0 + GEOM.r1) / 2 + grow / 2;
    const tx = a.cx + rm * Math.cos(c * Math.PI / 180), ty = a.cy + rm * Math.sin(c * Math.PI / 180);
    if (item.swatch) {
      g.appendChild(el('circle', { cx: tx, cy: ty, r: 11, fill: token(item.swatch),
        stroke: token('page-bg'), 'stroke-width': 2 }));
    } else {
      const t = el('text', { x: tx, y: ty, dy: '0.35em' }); t.textContent = item.label; g.appendChild(t);
      if (item.children) { const ct = el('text', { x: tx, y: ty + 15, dy: '0.35em', class: 'sub-caret' }); ct.textContent = '▸ more'; g.appendChild(ct); }
    }
    root.appendChild(g);
  });
  const hub = el('circle', { class: 'rm-hub', cx: a.cx, cy: a.cy, r: GEOM.r0 - 2 });
  root.appendChild(hub);
  const hl = el('text', { class: 'rm-hub-label', x: a.cx, y: a.cy, dy: '0.35em' });
  hl.textContent = a.machine.stack.length > 1 ? '←' : (a.machine.stack[0].title || '').slice(0, 9);
  root.appendChild(hl);
  gMenu.appendChild(root);
}

function closeMenu() {
  menu.active = null; gMenu.textContent = '';
  svg.setAttribute('aria-label', 'Graph canvas. Long-press or right-click for radial menu.');
}

/* ---------- pointer adapter ---------- */
const pointers = new Map();
let gesture = null;  // {kind:'node'|'pan'|'menu'|'pinch', ...}
let lpTimer = null;

function polarFromMenu(px, py) {
  const a = menu.active;
  const dx = px - a.cx, dy = py - a.cy;
  return { r: Math.hypot(dx, dy), thetaDeg: Math.atan2(dy, dx) * 180 / Math.PI };
}

function contextAt(target, px, py) {
  const nodeEl = target.closest ? target.closest('[data-node]') : null;
  const edgeEl = target.closest ? target.closest('[data-edge]') : null;
  const w = toWorld(px, py);
  if (nodeEl) {
    const id = nodeEl.getAttribute('data-node');
    if (store.selection.has(id) && store.selection.size > 1)
      return { type: 'selection', targetIds: [...store.selection], position: w };
    return { type: 'node', targetIds: [id], position: w };
  }
  if (edgeEl) return { type: 'edge', targetIds: [edgeEl.getAttribute('data-edge')], position: w };
  return { type: 'canvas', targetIds: [], position: w };
}

svg.addEventListener('pointerdown', (e) => {
  meters.l0++; meters.inputsSinceIntent++;
  lastInputT = e.timeStamp;
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (menu.active) {
    const { r, thetaDeg } = polarFromMenu(e.clientX, e.clientY);
    feed({ type: 'down', r, thetaDeg });
    return;
  }
  if (pointers.size === 2) {   // pinch start
    meters.l1++;
    clearTimeout(lpTimer); lpTimer = null;
    const [p1, p2] = [...pointers.values()];
    gesture = { kind: 'pinch', d0: Math.hypot(p2.x - p1.x, p2.y - p1.y), k0: view.k, cx: (p1.x + p2.x) / 2, cy: (p1.y + p2.y) / 2, v0: { ...view } };
    return;
  }
  const ctx = contextAt(e.target, e.clientX, e.clientY);
  const nodeId = ctx.type === 'node' ? ctx.targetIds[0] : null;
  gesture = { kind: nodeId ? 'node' : 'pan', id: nodeId, sx: e.clientX, sy: e.clientY, moved: false,
    v0: { ...view }, n0: nodeId ? { ...store.nodes.get(nodeId) } : null, ctx };
  // long-press → release-select menu
  if (e.pointerType !== 'mouse' || e.button === 0) {
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (gesture && !gesture.moved) {
        meters.l1++; meterHud();
        const c = gesture.ctx.type === 'node' || gesture.ctx.type === 'selection'
          ? nodeScreenPos(gesture.ctx) : { x: e.clientX, y: e.clientY };
        gesture = null;
        openMenu(ctx, c.x, c.y, 'tracking');
        if (navigator.vibrate) navigator.vibrate(15);
      }
    }, GEOM.longPressMs);
  }
});

function nodeScreenPos(ctx) {
  const n = store.nodes.get(ctx.targetIds[0]);
  return n ? { x: n.x * view.k + view.x, y: n.y * view.k + view.y } : { x: innerWidth / 2, y: innerHeight / 2 };
}

svg.addEventListener('pointermove', (e) => {
  meters.l0++;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (menu.active) {
    const { r, thetaDeg } = polarFromMenu(e.clientX, e.clientY);
    feed({ type: 'move', r, thetaDeg });
    return;
  }
  if (!gesture) return;

  if (gesture.kind === 'pinch' && pointers.size >= 2) {
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const k = Math.min(3, Math.max(0.3, gesture.k0 * d / gesture.d0));
    view.k = k;
    view.x = gesture.cx - (gesture.cx - gesture.v0.x) * (k / gesture.k0);
    view.y = gesture.cy - (gesture.cy - gesture.v0.y) * (k / gesture.k0);
    applyView(); return;
  }
  const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
  if (!gesture.moved && Math.hypot(dx, dy) > GEOM.slop) { gesture.moved = true; clearTimeout(lpTimer); lpTimer = null; }
  if (!gesture.moved) return;

  if (gesture.kind === 'node') {
    const n = store.nodes.get(gesture.id);
    if (n) { n.x = gesture.n0.x + dx / view.k; n.y = gesture.n0.y + dy / view.k; render(); }
  } else if (gesture.kind === 'pan') {
    view.x = gesture.v0.x + dx; view.y = gesture.v0.y + dy; applyView();
  }
});

svg.addEventListener('pointerup', (e) => {
  meters.l0++; meters.l1++;   // every down..up envelope resolves to one gesture
  lastInputT = e.timeStamp;
  pointers.delete(e.pointerId);
  clearTimeout(lpTimer); lpTimer = null;

  if (menu.active) {
    const { r, thetaDeg } = polarFromMenu(e.clientX, e.clientY);
    feed({ type: 'up', r, thetaDeg });
    meterHud();
    return;
  }
  if (!gesture) { meterHud(); return; }
  const w = toWorld(e.clientX, e.clientY);
  // Selection is an intent like any other: it goes through dispatchIntent so it
  // is quantized when Q is on and contributes a TTC sample. Calling applyIntent
  // directly made the most frequent interaction on the page the one absent from
  // every latency figure the README prints.
  if (!gesture.moved && gesture.kind === 'node') {          // tap = selection intent
    const id = gesture.id;
    dispatchIntent({ action: store.selection.has(id) ? 'deselect' : 'select',
      context: { type: 'node', targetIds: [id], position: w }, itemId: null }, e.timeStamp);
  } else if (!gesture.moved && gesture.kind === 'pan') {    // tap empty = clear selection
    if (store.selection.size)
      dispatchIntent({ action: 'clear-selection', context: { type: 'canvas', targetIds: [], position: w }, itemId: null }, e.timeStamp);
  }
  gesture = null;
  meterHud();
});
svg.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); clearTimeout(lpTimer); lpTimer = null; gesture = null; if (menu.active) feed({ type: 'close' }); });

svg.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  meters.l0++; meters.l1++;
  clearTimeout(lpTimer); lpTimer = null; gesture = null;
  openMenu(contextAt(e.target, e.clientX, e.clientY), e.clientX, e.clientY, 'idle');
  meterHud();
});

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  // Continuous navigation is metered at L0/L1 and deliberately NOT charged to
  // IPA (metrics record §1's v0 exclusion). Metered at neither is not the same
  // as excluded from one.
  meters.l0++; meters.l1++;
  const k = Math.min(3, Math.max(0.3, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  view.x = e.clientX - (e.clientX - view.x) * (k / view.k);
  view.y = e.clientY - (e.clientY - view.y) * (k / view.k);
  view.k = k; applyView();
}, { passive: false });

/* ---------- keyboard adapter ---------- */
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  if (menu.active && e.key === 'Tab') { e.preventDefault(); return; }   // focus trap: rad interaction contract §3
  // roving node focus: arrows walk the graph, Enter opens the menu there
  if (!menu.active && document.activeElement?.hasAttribute?.('data-node')) {
    const dirs = { ArrowRight: 0, ArrowDown: 90, ArrowLeft: 180, ArrowUp: -90 };
    if (e.key in dirs) {
      e.preventDefault();
      meters.l0++; meters.l1++;
      focusNode(nearestNode(focusNodeId, dirs[e.key]));
      render();                      // render() preserves focus; no second call needed
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      meters.l0++; meters.l1++; meters.inputsSinceIntent++;
      lastInputT = e.timeStamp;
      const n = store.nodes.get(focusNodeId);
      const p = { x: n.x * view.k + view.x, y: n.y * view.k + view.y };
      openMenu({ type: 'node', targetIds: [n.id], position: { x: n.x, y: n.y } }, p.x, p.y, 'idle');
      meterHud();
      return;
    }
  }
  if (menu.active) {
    if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'Enter', 'Escape'].includes(e.key)) {
      e.preventDefault();
      meters.l0++; meters.l1++; meters.inputsSinceIntent++;
      lastInputT = e.timeStamp;
      feed({ type: 'key', key: e.key });
      meterHud();
    }
    return;
  }
  if (e.key !== 'm' && e.key !== 'M' && e.key.length === 1 && /[a-z]/i.test(e.key)) {
    chordKey(e);   // chord/typed-word adapter (CharaChorder path); 'm' is reserved
    return;
  }
  if (e.key === 'm' || e.key === 'M') {
    meters.l0++; meters.l1++; meters.inputsSinceIntent++;
    lastInputT = e.timeStamp;
    let ctx;
    if (store.selection.size > 1) ctx = { type: 'selection', targetIds: [...store.selection], position: centroid([...store.selection]) };
    else if (store.selection.size === 1) { const id = [...store.selection][0]; ctx = { type: 'node', targetIds: [id], position: { ...store.nodes.get(id) } }; }
    else ctx = { type: 'canvas', targetIds: [], position: toWorld(innerWidth / 2, innerHeight / 2) };
    const p = ctx.targetIds.length ? nodeScreenPos(ctx) : { x: innerWidth / 2, y: innerHeight / 2 };
    openMenu(ctx, p.x, p.y, 'idle');
  }
});
function centroid(ids) {
  const ns = ids.map(id => store.nodes.get(id)).filter(Boolean);
  return { x: ns.reduce((s, n) => s + n.x, 0) / ns.length, y: ns.reduce((s, n) => s + n.y, 0) / ns.length };
}

/* ---------- conformance UI ---------- */
document.getElementById('conf-btn').addEventListener('click', (e) => {
  const res = runConformance();
  const passed = res.filter(r => r.pass).length;
  const btn = e.currentTarget;
  btn.textContent = `${passed}/${res.length} vectors ${passed === res.length ? '✓' : '✗'} v${VECTORS.version}`;
  btn.classList.toggle('pass', passed === res.length);
  btn.classList.toggle('fail', passed !== res.length);
  res.filter(r => !r.pass).forEach(r => console.warn('FAIL', r.name, '—', r.why));
});

/* ---------- boot ---------- */
/* ============================================================
 * MOTION — every animation on the page lives here, named and
 * documented (benchmark animations.js convention). The API is
 * shaped like anime.js ({targets → el, duration, complete}) so a
 * swap to the vendored library is mechanical, but each motion is
 * compositor-only (transform/opacity) and capped at 240 ms:
 * speed first, choreography second. Honors prefers-reduced-motion
 * by jumping straight to end states.
 * ============================================================ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion = {
  D: { tap: 90, move: 170, ring: 200, spot: 220, max: 240 },
  raf(el, ms, fn, done) {                       // core tween loop
    if (REDUCED || ms <= 0) { fn(1); done && done(); return; }
    const t0 = performance.now();
    (function loop(t) {
      const k = Math.min(1, (t - t0) / ms);
      fn(1 - (1 - k) * (1 - k));                // easeOutQuad
      if (k < 1) requestAnimationFrame(loop); else done && done();
    })(t0);
  },
  /** finger(points, msPerLeg) — glide the ghost finger through screen points. */
  finger(points, msPerLeg = motion.D.move) {
    const f = document.getElementById('finger');
    return new Promise((res) => {
      f.style.opacity = '1';
      let i = 0;
      const leg = () => {
        if (i >= points.length) { res(); return; }
        const from = i === 0 ? points[0] : points[i - 1], to = points[i]; i++;
        motion.raf(f, i === 1 ? 0 : msPerLeg, (k) => {
          f.style.left = from.x + (to.x - from.x) * k + 'px';
          f.style.top = from.y + (to.y - from.y) * k + 'px';
        }, leg);
      };
      leg();
    });
  },
  fingerHide() { document.getElementById('finger').style.opacity = '0'; },
  /** ripple(x, y) — tap indicator at a screen point. */
  ripple(x, y) {
    const r = document.createElement('div');
    r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px';
    document.body.appendChild(r);
    motion.raf(r, motion.D.ring, (k) => {
      const d = 10 + 40 * k;
      r.style.width = r.style.height = d + 'px'; r.style.opacity = String(1 - k);
    }, () => r.remove());
  },
  /** spotlight(el) — pulse an outline around any DOM element twice. */
  spotlight(el) {
    if (!el) return;
    const b = el.getBoundingClientRect();
    const s = document.createElement('div');
    s.className = 'spot';
    s.style.cssText += `left:${b.left - 5}px;top:${b.top - 5}px;width:${b.width + 10}px;height:${b.height + 10}px`;
    document.body.appendChild(s);
    motion.raf(s, motion.D.spot * 2, (k) => { s.style.opacity = String(k < 0.5 ? 1 : 2 - 2 * k); },
      () => s.remove());
  },
};

/* ============================================================
 * DEMO DRIVER — "show, don't tell". Each helper narrates itself
 * through the ghost finger, then drives the SAME seam real input
 * adapters use (openMenu/feed/dispatchIntent/chord burst), so a
 * demo is an execution of the product path, not a movie of one.
 * ============================================================ */
/* Choreography, as fractions of ONE action period. These are the only tuned
 * numbers left in the demo driver: unitless, tempo-independent, and named.
 * Raising `aps` speeds the whole tour up with its shape intact, which is what
 * a reader is actually learning. (tempo record §2) */
const BEATS = { travel: 0.45, dwell: 0.35, settle: 0.30, ring: 0.22, hold: 0.55, read: 0.8 };
function beatMs(k) { return REDUCED ? 0 : Math.round(BEATS[k] * actionPeriod()); }

const demo = {
  busy: false,
  screenOf(id) { const n = store.nodes.get(id); return { x: n.x * view.k + view.x, y: n.y * view.k + view.y }; },
  sleep: (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms)),
  /** wait(k) — hold for a named choreography beat at the current tempo. */
  wait(k) { return this.sleep(beatMs(k)); },
  async longPressNode(id) {
    const p = this.screenOf(id);
    await motion.finger([p], beatMs('travel'));
    motion.ripple(p.x, p.y);
    await this.wait('dwell');
    meters.inputsSinceIntent++;              // the demo press is one honest input
    lastInputT = performance.now();
    openMenu(contextAt(document.querySelector(`[data-node="${id}"]`) ?? svg, p.x, p.y), p.x, p.y, 'tracking');
    if (navigator.vibrate) navigator.vibrate(15);
    return p;
  },
  async sweep(deg, r = 76) {
    const a = menu.active; if (!a) return;
    const to = { x: a.cx + r * Math.cos(deg * Math.PI / 180), y: a.cy + r * Math.sin(deg * Math.PI / 180) };
    await motion.finger([to], beatMs('travel'));
    feed({ type: 'move', r, thetaDeg: deg });
    await this.wait('hold');
    return to;
  },
  async release(deg, r = 76) {
    lastInputT = performance.now();
    feed({ type: 'up', r, thetaDeg: deg });
    motion.fingerHide();
  },
  async tapNode(id) {
    const p = this.screenOf(id);
    await motion.finger([p], beatMs('travel')); motion.ripple(p.x, p.y);
    meters.inputsSinceIntent++;              // one tap, one input
    lastInputT = performance.now();
    dispatchIntent({ action: store.selection.has(id) ? 'deselect' : 'select',
      context: { type: 'node', targetIds: [id], position: { ...store.nodes.get(id) } }, itemId: null }, lastInputT);
    await this.wait('settle'); motion.fingerHide();
  },
  async chord(word) {
    // Inject a machine-fast burst through the real chord pipeline.
    announce('chord: ' + word);
    const t0 = performance.now();
    word.split('').forEach((k, i) => {
      meters.l0++; meters.inputsSinceIntent++;
      burst.evts.push({ k, t: t0 + i * 6 });
    });
    lastInputT = t0 + (word.length - 1) * 6;
    clearTimeout(burst.timer);
    finalizeBurst();
    motion.spotlight(document.getElementById('log'));
  },
  async spotChip(id) { const el = document.getElementById(id); motion.spotlight(el); await this.wait('ring'); return el; },
};

const tourState = { seen: new Set(), open: true };
function tourProgress() {
  const total = TOUR.reduce((n, c) => n + c.steps.length, 0);
  document.getElementById('tour-prog').textContent = `${tourState.seen.size}/${total} shown`;
}
function buildTour() {
  const body = document.getElementById('tour-body');
  body.innerHTML = '';
  for (const ch of TOUR) {
    const h = document.createElement('h3'); h.textContent = ch.ch; body.appendChild(h);
    const ol = document.createElement('ol');
    for (const s of ch.steps) {
      const li = document.createElement('li');
      li.className = 'step'; li.id = 't-' + s.id;
      li.innerHTML = `<button class="go" aria-label="Show: ${s.label}">▶</button>` +
        `<div class="tx"><b>${s.label}</b><span>${s.desc}</span></div>`;
      li.querySelector('.go').addEventListener('click', () => runStep(s, li));
      ol.appendChild(li);
    }
    body.appendChild(ol);
  }
  tourProgress();
}
async function runStep(s, li) {
  if (demo.busy) return;
  demo.busy = true;
  li.classList.add('running');
  history.replaceState(null, '', '#t-' + s.id);
  announce('Showing: ' + s.label);
  try { await s.run(); } catch (e) { console.warn('demo step failed', s.id, e); }
  motion.fingerHide();
  li.classList.remove('running');
  li.classList.add('seen');
  tourState.seen.add(s.id);
  tourProgress();
  demo.busy = false;
}
function setTour(open) {
  tourState.open = open;
  document.getElementById('tour-panel').classList.toggle('closed', !open);
  document.getElementById('tour-chip').setAttribute('aria-expanded', String(open));
}

/* ---------- roving node focus (keyboard graph navigation) ---------- */
let focusNodeId = null;
function focusNode(id) {
  focusNodeId = id;
  document.querySelectorAll('.node.kfocus').forEach((n) => n.classList.remove('kfocus'));
  const el = document.querySelector(`[data-node="${id}"]`);
  if (el) { el.classList.add('kfocus'); el.setAttribute('tabindex', '0'); el.focus({ preventScroll: true }); }
  const n = store.nodes.get(id);
  if (n) announce(`${n.label}${n.pinned ? ', pinned' : ''}${store.selection.has(id) ? ', selected' : ''}`);
}
function nearestNode(fromId, dirDeg) {
  const from = store.nodes.get(fromId); if (!from) return fromId;
  let best = null, bestScore = Infinity;
  for (const n of store.nodes.values()) {
    if (n.id === fromId || n.hidden) continue;
    const ang = Math.atan2(n.y - from.y, n.x - from.x) * 180 / Math.PI;
    const dAng = Math.abs(((ang - dirDeg + 540) % 360) - 180);
    if (dAng > 60) continue;
    const dist = Math.hypot(n.x - from.x, n.y - from.y);
    const score = dist * (1 + dAng / 60);
    if (score < bestScore) { bestScore = score; best = n.id; }
  }
  return best ?? fromId;
}

/* ---------- scripted playback (MIDI transport drives this too) ---------- */
const playback = { running: false, cancel: false, index: 0 };
function allSteps() { return TOUR.flatMap((ch) => ch.steps); }
async function playTour(from = 'start') {
  if (playback.running) return;
  if (from === 'start') playback.index = 0;
  playback.running = true; playback.cancel = false;
  document.getElementById('tour-panel').classList.add('playing');
  document.getElementById('stop-chip').disabled = false;
  document.getElementById('play-chip').textContent = '▶ Playing';
  const steps = allSteps();
  while (playback.index < steps.length && !playback.cancel) {
    const s = steps[playback.index];
    const li = document.getElementById('t-' + s.id);
    li?.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' });
    await runStep(s, li);
    playback.index++;
    if (!playback.cancel) await demo.wait('settle');
  }
  if (playback.index >= steps.length) playback.index = 0;
  stopTour();
}
function stopTour() {
  playback.running = false; playback.cancel = true;
  document.getElementById('tour-panel')?.classList.remove('playing');
  const stop = document.getElementById('stop-chip'), play = document.getElementById('play-chip');
  if (stop) stop.disabled = true;
  if (play) play.textContent = '▶ Play';
}
function setQmode(mode) {
  qmode = ['off', 'beat', 'bar'].includes(mode) ? mode : 'off';
  const c = document.getElementById('q-chip');
  if (c) { c.textContent = 'Q ' + qmode; c.classList.toggle('on', qmode !== 'off'); }
}

/* ---------- control wiring ---------- */
document.getElementById('clock-chip').addEventListener('click', () => {
  const seq = [60, 72, 90, 120, 144];                 // slow first: the default is the point
  setInternalBpm(seq[(seq.indexOf(Math.round(clock.bpm)) + 1) % seq.length] || 60);
});
document.getElementById('q-chip').addEventListener('click', () =>
  setQmode(qmode === 'off' ? 'beat' : qmode === 'beat' ? 'bar' : 'off'));
document.getElementById('midi-chip').addEventListener('click', connectMidi);
document.getElementById('theme-chip').addEventListener('click', () =>
  setTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]));

document.getElementById('bpm-range').addEventListener('input', (e) => setInternalBpm(+e.target.value));
document.getElementById('aps-range').addEventListener('input', (e) => setAps(+e.target.value));
document.getElementById('div-select').addEventListener('change', (e) => setDiv(+e.target.value));
document.getElementById('aps-link').addEventListener('change', (e) => setLinked(e.target.checked));
document.getElementById('play-chip').addEventListener('click', () => playTour(playback.index ? 'continue' : 'start'));
document.getElementById('stop-chip').addEventListener('click', stopTour);

document.getElementById('tour-chip').addEventListener('click', () => setTour(!tourState.open));
document.getElementById('tour-close').addEventListener('click', () => setTour(false));

/* A skip link that only moves the scroll position is not a skip link. The
 * panel carries tabindex="-1" so it can receive focus programmatically without
 * entering the tab order. */
document.querySelector('.skip').addEventListener('click', (e) => {
  e.preventDefault();
  const panel = document.getElementById('tour-panel');
  if (!tourState.open) setTour(true);
  panel.focus({ preventScroll: false });
  announce('Tour panel');
});

/* ---------- boot ---------- */
document.getElementById('subtitle').textContent =
  `QM's default radial menu · contract v${VECTORS.version}`;   // derived, never copied

let storedTheme = null, storedTempo = null;
try {
  storedTheme = localStorage.getItem('rad.theme');
  storedTempo = JSON.parse(localStorage.getItem('rad.tempo') || 'null');
} catch { /* private mode: fall through to defaults */ }
setTheme(THEMES.includes(storedTheme) ? storedTheme : defaultTheme());

seedGraph();
focusNodeId = 'qm';
render();
fitView();
/* Default: 60 bpm, one action per second, linked. Deliberately slow — a
 * first-time reader has to see the gesture, and a demo paced for its author
 * teaches nothing (tempo record §1). */
tempo.div = storedTempo && DIVS.includes(storedTempo.div) ? storedTempo.div : 1;
tempo.linked = storedTempo ? !!storedTempo.linked : true;
setInternalBpm(storedTempo?.bpm ?? 60);
if (!tempo.linked && storedTempo?.aps) setAps(storedTempo.aps);
beatLoop();
meterHud();
buildTour();
setTour(true);
updateSpeedUI();
if (location.hash.startsWith('#t-')) {
  const li = document.getElementById(location.hash.slice(1));
  if (li) { li.scrollIntoView({ block: 'center' }); li.querySelector('.go')?.focus(); }
}
addEventListener('resize', () => { if (!menu.active) fitView(); });
</script>
</body>
